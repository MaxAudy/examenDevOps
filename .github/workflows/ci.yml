name: CI Laravel

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo, pdo_mysql, mbstring, bcmath, zip

      - name: Installer les dépendances
        run: composer install --no-interaction --prefer-dist

      - name: Vérifier le formatage avec Pint
        run: ./vendor/bin/pint --test

  analyse:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo, pdo_mysql, mbstring, bcmath, zip

      - name: Installer les dépendances
        run: composer install --no-interaction --prefer-dist

      - name: Analyse statique PHPStan
        run: ./vendor/bin/phpstan analyse --no-progress --memory-limit=512M

      - name: Audit des dépendances
        run: composer audit --abandoned=ignore
